<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="visaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="paymentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="url(#headerGrad)" />
  <text x="60" y="72" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="0.5">WORLD PORTAL — System Architecture &amp; Direct Service Payment Flow</text>
  <text x="940" y="72" fill="#e0e7ff" font-size="14" font-weight="500">NestJS + Prisma + PostgreSQL</text>

  <!-- External Actors / API Clients -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="220" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="20" y="35" fill="#f8fafc" font-size="16" font-weight="600">Applicant / Partner</text>
    <text x="20" y="60" fill="#94a3b8" font-size="12">Public &amp; Registered Access</text>
    <rect x="20" y="72" width="180" height="24" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="30" y="88" fill="#60a5fa" font-size="11">POST /api/visa-documentation</text>
  </g>

  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="220" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="20" y="35" fill="#f8fafc" font-size="16" font-weight="600">Admin / Manager</text>
    <text x="20" y="60" fill="#94a3b8" font-size="12">RBAC Control (MANAGER)</text>
    <rect x="20" y="72" width="180" height="24" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="30" y="88" fill="#c084fc" font-size="11">POST /api/payments/refund</text>
  </g>

  <!-- Section 1: Visa Documentation Domain -->
  <g transform="translate(330, 130)">
    <rect x="0" y="0" width="380" height="730" rx="14" fill="url(#visaGrad)" stroke="#3b82f6" stroke-width="2" />
    <rect x="15" y="15" width="350" height="35" rx="6" fill="#1e3a8a" />
    <text x="30" y="38" fill="#93c5fd" font-size="15" font-weight="700">1. Visa Documentation Module (src/visa-documentation)</text>

    <!-- Sub-step 1.1 -->
    <rect x="20" y="70" width="340" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="35" y="95" fill="#38bdf8" font-size="14" font-weight="600">Step 1: Application Submission</text>
    <text x="35" y="118" fill="#cbd5e1" font-size="12">Generates ApplicationNo (VISA-2026-XXXX)</text>
    <text x="35" y="140" fill="#f59e0b" font-size="12" font-weight="500">Status: SUBMITTED | PENDING_EVALUATION</text>

    <!-- Sub-step 1.2 -->
    <rect x="20" y="180" width="340" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="35" y="205" fill="#38bdf8" font-size="14" font-weight="600">Step 2: Admin Cost Evaluation</text>
    <text x="35" y="228" fill="#cbd5e1" font-size="12">Sets totalAmount &amp; allowInstallment</text>
    <text x="35" y="250" fill="#f59e0b" font-size="12" font-weight="500">Status: EVALUATED | AWAITING_PAYMENT</text>

    <!-- Sub-step 1.3 -->
    <rect x="20" y="490" width="340" height="120" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="35" y="515" fill="#34d399" font-size="14" font-weight="700">Direct Service Callback Target</text>
    <text x="35" y="538" fill="#f8fafc" font-size="12" font-weight="600">handlePaymentConfirmed(visaDocId, amount, option)</text>
    <text x="35" y="560" fill="#cbd5e1" font-size="11">• Updates amountPaid &amp; balanceDue</text>
    <text x="35" y="578" fill="#cbd5e1" font-size="11">• Sets paymentStatus: PARTIALLY / FULLY_PAID</text>
    <text x="35" y="596" fill="#10b981" font-size="12" font-weight="700">★ Auto-advances Status → UNDER_REVIEW</text>

    <!-- Sub-step 1.4 -->
    <rect x="20" y="630" width="340" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="35" y="655" fill="#38bdf8" font-size="14" font-weight="600">Step 5: Final Review &amp; Approval</text>
    <text x="35" y="680" fill="#94a3b8" font-size="12">Staff updates status → APPROVED / REJECTED</text>
  </g>

  <!-- Section 2: Payment Domain Module -->
  <g transform="translate(760, 130)">
    <rect x="0" y="0" width="390" height="730" rx="14" fill="url(#paymentGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="360" height="35" rx="6" fill="#065f46" />
    <text x="30" y="38" fill="#a7f3d0" font-size="15" font-weight="700">2. Payment Engine Module (src/payment)</text>

    <!-- Payment Initiation -->
    <rect x="20" y="70" width="350" height="110" rx="8" fill="#022c22" stroke="#059669" stroke-width="1.5" />
    <text x="35" y="95" fill="#6ee7b7" font-size="14" font-weight="600">POST /api/payments/initiate</text>
    <text x="35" y="118" fill="#ecfdf5" font-size="12">Option: FULL or HALF_INSTALLMENT</text>
    <text x="35" y="140" fill="#94a3b8" font-size="11">Creates PaymentTransaction record (INITIATED)</text>
    <text x="35" y="160" fill="#a7f3d0" font-size="11">Generates Ref: TXN-PAY-XXXXXX</text>

    <!-- Payment Confirmation -->
    <rect x="20" y="210" width="350" height="170" rx="8" fill="#022c22" stroke="#10b981" stroke-width="2" />
    <text x="35" y="235" fill="#34d399" font-size="15" font-weight="700">POST /api/payments/confirm</text>
    <text x="35" y="258" fill="#ecfdf5" font-size="12">1. Validates transactionRef: TXN-PAY-XXXXXX</text>
    <text x="35" y="280" fill="#ecfdf5" font-size="12">2. Invokes VisaDocumentationService directly:</text>
    <rect x="35" y="295" width="320" height="34" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="45" y="316" fill="#a7f3d0" font-size="11" font-weight="600">this.visaDocService.handlePaymentConfirmed(...)</text>
    <text x="35" y="355" fill="#6ee7b7" font-size="11" font-weight="500">✓ 0ms In-Memory Execution (Option 1 DI)</text>

    <!-- Refunds & Config -->
    <rect x="20" y="400" width="350" height="130" rx="8" fill="#022c22" stroke="#059669" stroke-width="1.5" />
    <text x="35" y="425" fill="#6ee7b7" font-size="14" font-weight="600">Surcharged Refunds &amp; Config</text>
    <text x="35" y="448" fill="#ecfdf5" font-size="12">POST /api/payments/refund (MANAGER)</text>
    <text x="35" y="470" fill="#cbd5e1" font-size="11">• Configurable refund surcharge (e.g. 15%)</text>
    <text x="35" y="490" fill="#cbd5e1" font-size="11">• Partner markup percentage settings (10%)</text>
    <text x="35" y="510" fill="#a7f3d0" font-size="11">• Creates PaymentRefund record (PROCESSED)</text>

    <!-- Payment Ledgers -->
    <rect x="20" y="550" width="350" height="155" rx="8" fill="#022c22" stroke="#059669" stroke-width="1.5" />
    <text x="35" y="575" fill="#6ee7b7" font-size="14" font-weight="600">Financial Ledger Data Models</text>
    <text x="35" y="598" fill="#cbd5e1" font-size="12">• PaymentConfig (fee markup rates)</text>
    <text x="35" y="620" fill="#cbd5e1" font-size="12">• PaymentTransaction (transaction history)</text>
    <text x="35" y="642" fill="#cbd5e1" font-size="12">• PaymentRefund (net refund ledgers)</text>
    <text x="35" y="675" fill="#10b981" font-size="12" font-weight="600">Clean Transaction Reference Ledger</text>
  </g>

  <!-- Connectors / Flow Arrows -->
  <path d="M 270 195 L 320 195" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 270 310 L 300 310 L 300 230 L 320 230" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)" />
  <path d="M 520 270 L 520 310 L 750 310 L 750 125 L 770 125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />

  <!-- Direct Service Call Arrow (Option 1) -->
  <path d="M 770 312 L 685 312 L 685 540 L 680 540" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowActive)" />
  <rect x="695" y="420" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="702" y="437" fill="#a7f3d0" font-size="11" font-weight="700">Direct In-Memory Call</text>

  <!-- Database Box at Bottom -->
  <g transform="translate(330, 785)">
    <rect x="0" y="0" width="820" height="85" rx="10" fill="url(#dbGrad)" stroke="#6366f1" stroke-width="2" />
    <text x="25" y="32" fill="#a5b4fc" font-size="15" font-weight="700">PostgreSQL Database Layer (Prisma ORM)</text>
    <text x="25" y="60" fill="#cbd5e1" font-size="12">Tables: Profile | VisaDocumentation | PaymentConfig | PaymentTransaction | PaymentRefund</text>
    <text x="640" y="48" fill="#818cf8" font-size="13" font-weight="600">Atomic Transactions &amp; Foreign Keys</text>
  </g>
</svg>
